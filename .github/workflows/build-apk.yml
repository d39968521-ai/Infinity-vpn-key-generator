name: Build & Publish Universal APK (Android + Smart TV)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK (API 36.1)
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install API 36.1
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment & debug keystore
        run: |
          rm -f local.properties
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to releases
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/StrausTop-Universal-TV-Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrausTop-Universal-TV-Mobile-APK
          path: releases/StrausTop-Universal-TV-Mobile.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0-universal' || github.ref_name }}
          name: "Straus Top Universal (Android + Smart TV)"
          body: |
            ### Универсальная сборка Straus Top для Смартфонов и Smart TV / Android TV
            - Поддержка сенсорных экранов (Android 7.0+) и телевизоров / ТВ-приставок (Android TV / Google TV с управлением пультом ДУ D-Pad).
            - Автоматическое определение типа устройства.
            - Полноэкранный QR-код для быстрого сканирования с экрана телевизора.
          files: |
            releases/StrausTop-Universal-TV-Mobile.apk
